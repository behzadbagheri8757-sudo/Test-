<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BAGHERI — Invoice Items (Zoho-clean + price info)</title>
<style>
:root {
  --blue: #0070D2;
  --text: #1F2937;
  --muted: #667085;
  --faint: #98A2B3;
  --divider: rgba(15,23,42,.06);
  --surface: #FFFFFF;
  --bg: #F5F7FA;
  --danger: #D52B36;
  --success: #0F7A4A;
}
[data-theme="dark"] {
  --blue: #4FA3FF;
  --text: #F2F2F7;
  --muted: #9AA0A6;
  --faint: #6E7378;
  --divider: rgba(255,255,255,.08);
  --surface: #1C1C1E;
  --bg: #000000;
  --danger: #FF6B6B;
  --success: #4ADE80;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  background: #E8EBF0; color: var(--text);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Controls bar ---------- */
.controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #0F172A; color: #FFF;
  padding: 8px 12px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  font-size: 12px;
}
.controls .lbl { color: #94A3B8; font-size: 11px; margin-inline-end: 4px; }
.controls button {
  background: rgba(255,255,255,.08); color: #E2E8F0;
  border: 1px solid rgba(255,255,255,.14);
  padding: 5px 10px; border-radius: 6px;
  font-family: inherit; font-size: 11px; cursor: pointer;
}
.controls button.active {
  background: #0070D2; border-color: #0070D2;
  color: #FFF; font-weight: 600;
}

/* ---------- Phone ---------- */
.phone-wrap {
  padding: 56px 12px 24px;
  display: flex; justify-content: center;
  min-height: 100vh;
}
.phone {
  width: 390px;
  height: calc(100vh - 80px);
  max-height: 900px;
  background: var(--bg);
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 16px 48px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.06);
  transition: width 180ms ease, background 180ms ease;
}
.phone[data-w="320"] { width: 320px; }
.phone[data-w="375"] { width: 375px; }
.phone[data-w="390"] { width: 390px; }
.phone[data-w="430"] { width: 430px; }
@media (max-width: 480px) {
  .controls { position: sticky; top: 0; }
  .phone-wrap { padding: 0; min-height: 0; }
  .phone {
    width: 100% !important;
    height: calc(100vh - 44px);
    max-height: none; border-radius: 0; box-shadow: none;
  }
}

/* ---------- Sheet ---------- */
.sheet {
  display: flex; flex-direction: column;
  height: 100%; background: var(--bg);
}

/* ---------- Header ---------- */
.hdr {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--divider);
}
.hdr-cancel {
  flex: 0 0 auto; background: transparent;
  color: var(--muted); border: none;
  padding: 8px 12px; font-family: inherit; font-size: 15px;
  cursor: pointer;
}
.hdr-title {
  flex: 1; text-align: center;
  font-size: 16px; font-weight: 600; color: var(--text);
}
.hdr-save {
  flex: 0 0 auto; background: transparent;
  color: var(--blue); border: none;
  padding: 8px 12px; font-family: inherit;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
}

/* ---------- Body ---------- */
.body {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 0 40px;
}

/* ---------- Section label ---------- */
.sec-lbl {
  padding: 0 20px 8px;
  font-size: 12px;
  color: var(--muted);
}

/* ---------- Customer / date ---------- */
.ctx {
  margin: 0 16px 20px;
  padding: 14px 16px;
  background: var(--surface);
  border-radius: 12px;
  display: flex; align-items: center; gap: 12px;
}
.ctx-av {
  width: 40px; height: 40px; flex: 0 0 40px;
  border-radius: 50%;
  background: rgba(0,112,210,.1);
  color: var(--blue);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 16px;
}
.ctx-info { flex: 1; min-width: 0; }
.ctx-name { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
.ctx-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

.date-line {
  margin: 0 16px 20px;
  padding: 12px 16px;
  background: var(--surface);
  border-radius: 12px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 14px;
}
.date-line .lbl { color: var(--muted); }
.date-line .val { color: var(--text); font-weight: 500; }

/* ---------- Items card ---------- */
.items-card {
  margin: 0 16px 20px;
  background: var(--surface);
  border-radius: 14px;
  overflow: hidden;
}

.item-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 14px 16px;
  min-height: 68px;
  cursor: pointer;
  border-bottom: 0.5px solid var(--divider);
  transition: background 120ms ease;
}
.item-row:last-child { border-bottom: none; }
.item-row:active { background: rgba(127,127,127,.06); }

.item-name {
  font-size: 15px; font-weight: 500; color: var(--text);
  line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item-amount { text-align: left; min-width: 0; }
.item-total {
  display: block;
  font-size: 16px; font-weight: 600; color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  white-space: nowrap;
}
.item-calc {
  display: block;
  font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
  margin-top: 3px;
  white-space: nowrap;
}

/* ---------- Add new line ---------- */
.add-line {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  min-height: 56px;
  cursor: pointer;
  border-top: 0.5px solid var(--divider);
  color: var(--blue);
  font-size: 15px; font-weight: 500;
  background: transparent;
  border-left: none; border-right: none; border-bottom: none;
  width: 100%; font-family: inherit;
}
.add-line:active { background: rgba(0,112,210,.05); }
.add-line-plus {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--blue);
  color: #FFF;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 400;
  line-height: 1;
  padding-bottom: 1px;
}

/* ---------- Summary ---------- */
.summary {
  margin: 0 16px 20px;
  background: var(--surface);
  border-radius: 14px;
  padding: 0 16px;
}
.sum-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--divider);
  font-size: 14px;
}
.sum-row:last-child { border-bottom: none; }
.sum-row .lbl { color: var(--muted); }
.sum-row .val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.sum-row.total { padding: 15px 0; font-size: 16px; }
.sum-row.total .lbl { color: var(--text); font-weight: 600; }
.sum-row.total .val { color: var(--text); font-weight: 700; font-size: 17px; }

/* ---------- Payment ---------- */
.pay-sec { margin: 0 16px 20px; }
.pay-hd {
  padding: 0 4px 8px;
  font-size: 12px; color: var(--muted);
  display: flex; justify-content: space-between;
}
.pay-hd .total { color: var(--text); font-weight: 600; }
.pay-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 8px;
}
.pay-btn {
  min-height: 58px;
  background: var(--surface);
  border: 0.5px solid var(--divider);
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  font-family: inherit; font-size: 11px; font-weight: 500;
  color: var(--text); cursor: pointer;
}
.pay-btn svg {
  width: 20px; height: 20px;
  stroke: currentColor; stroke-width: 1.6;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}

/* =========================================================
   EDIT SHEET (bottom sheet)
   ========================================================= */
.edit-sheet-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity 220ms ease;
}
.edit-sheet-bg.show { opacity: 1; pointer-events: auto; }

.edit-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  z-index: 60;
  transform: translateY(110%);
  transition: transform 260ms cubic-bezier(.22,1,.36,1);
  max-height: 88%;
  overflow-y: auto;
  padding-bottom: 20px;
}
.edit-sheet.show { transform: translateY(0); }

.edit-handle {
  width: 36px; height: 4px;
  background: var(--divider);
  border-radius: 2px;
  margin: 8px auto 6px;
}
.edit-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 18px 14px;
  border-bottom: 0.5px solid var(--divider);
}
.edit-hd-title { font-size: 15px; font-weight: 600; }
.edit-hd-close {
  background: none; border: none;
  color: var(--blue); font-family: inherit;
  font-size: 15px; font-weight: 600;
  cursor: pointer; padding: 4px;
}

.edit-body { padding: 16px 18px; }
.edit-field { margin-bottom: 14px; }
.edit-field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.edit-field select,
.edit-field input {
  width: 100%;
  min-height: 44px;
  padding: 11px 12px;
  border: 0.5px solid var(--divider);
  border-radius: 10px;
  background: var(--bg);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  text-align: right;
}
.edit-field input {
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.edit-field select:focus,
.edit-field input:focus {
  outline: none;
  border-color: rgba(0,112,210,.45);
  box-shadow: 0 0 0 3px rgba(0,112,210,.08);
}
.edit-field-hint {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.edit-field-hint b {
  color: var(--text);
  font-weight: 600;
}

.edit-row-2 {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.4fr);
  gap: 10px;
}

/* ---------- Line total + profit ---------- */
.edit-line-total {
  padding: 14px 0;
  border-top: 0.5px solid var(--divider);
  border-bottom: 0.5px solid var(--divider);
  margin: 4px 0 14px;
}
.edit-line-total-main {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.edit-line-total-main .lbl {
  font-size: 13px;
  color: var(--muted);
}
.edit-line-total-main .val {
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.edit-line-profit {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.edit-line-profit .val {
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  filter: blur(4px);
  transition: filter 150ms ease;
}
.edit-line-profit.revealed .val { filter: none; }
.edit-line-profit.neg .val { color: var(--danger); }
.edit-line-profit.pos .val { color: var(--success); }

/* ---------- Price info (disclosure) ---------- */
.price-more-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
  padding: 10px 0;
  background: none; border: none;
  color: var(--blue);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: right;
  margin-bottom: 4px;
}
.price-more-toggle .chev {
  font-size: 12px;
  transition: transform 180ms ease;
  color: var(--muted);
}
.price-more-toggle.open .chev { transform: rotate(180deg); }

.price-more {
  padding: 4px 0 12px;
  border-bottom: 0.5px solid var(--divider);
  margin-bottom: 14px;
}
.price-more[hidden] { display: none; }

.price-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
  padding: 6px 0;
  font-size: 13px;
}
.price-row .k { color: var(--muted); }
.price-row .v {
  color: var(--text);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: left;
  white-space: nowrap;
}
.price-row .v .date {
  color: var(--faint);
  font-weight: 400;
  font-size: 11px;
  margin-inline-start: 4px;
}
.price-row .v.empty {
  color: var(--faint);
  font-weight: 400;
}

/* ---------- Actions ---------- */
.edit-actions {
  display: flex; gap: 10px;
}
.edit-actions button {
  flex: 1;
  min-height: 46px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.edit-del {
  background: transparent;
  color: var(--danger);
  border: 0.5px solid var(--divider) !important;
}
.edit-del:disabled { color: var(--faint); cursor: not-allowed; }
.edit-ok {
  background: var(--blue);
  color: #FFF;
}
.edit-ok:active { opacity: .88; }
</style>
</head>
<body data-theme="light">

<div class="controls">
  <div>
    <span class="lbl">Theme:</span>
    <button data-theme-btn="light" class="active">روشن</button>
    <button data-theme-btn="dark">تاریک</button>
  </div>
  <div>
    <span class="lbl">Width:</span>
    <button data-w="320">320</button>
    <button data-w="375">375</button>
    <button data-w="390" class="active">390</button>
    <button data-w="430">430</button>
  </div>
</div>

<div class="phone-wrap">
  <div class="phone" id="phone" data-w="390">
    <div class="sheet">
      <div class="hdr">
        <button class="hdr-cancel">لغو</button>
        <div class="hdr-title">فاکتور جدید</div>
        <button class="hdr-save">ثبت</button>
      </div>
      <div class="body" id="body"></div>
    </div>
    <div class="edit-sheet-bg" id="editBg"></div>
    <div class="edit-sheet" id="editSheet"></div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   Sample data
   ========================================================= */
const ITEMS = [
  { name: 'لوبیا چیتی',    qty: 5,  unit: 'کیلو',  unitPrice: 200000 },
  { name: 'نخود ابوگوشتی', qty: 3,  unit: 'کیلو',  unitPrice: 180000 },
  { name: 'کشمش پلویی',    qty: 1,  unit: 'کارتن', unitPrice: 2400000 },
];

/* Fake price intelligence — per product name */
const PRODUCT_DATA = {
  'لوبیا چیتی': {
    fifo: 140000,
    ref: 250000,
    lastSale: { price: 220000, date: '۱۴۰۳/۰۹/۲۰' },
    lastToThis: { price: 200000, date: '۱۴۰۳/۰۸/۱۵' },
  },
  'نخود ابوگوشتی': {
    fifo: 125000,
    ref: 220000,
    lastSale: { price: 185000, date: '۱۴۰۳/۰۹/۱۸' },
    lastToThis: null, // never sold to this customer
  },
  'کشمش پلویی': {
    fifo: 1800000,
    ref: 2500000,
    lastSale: { price: 2400000, date: '۱۴۰۳/۰۹/۲۵' },
    lastToThis: { price: 2400000, date: '۱۴۰۳/۰۹/۲۵' },
  },
  'عدس':           { fifo: 145000, ref: 230000, lastSale: { price: 210000, date: '۱۴۰۳/۰۹/۲۲' }, lastToThis: { price: 205000, date: '۱۴۰۳/۰۹/۰۵' } },
  'ماش':           { fifo: 180000, ref: 250000, lastSale: { price: 230000, date: '۱۴۰۳/۰۹/۱۵' }, lastToThis: null },
  'لپه':           { fifo: 165000, ref: 230000, lastSale: { price: 215000, date: '۱۴۰۳/۰۹/۱۰' }, lastToThis: null },
  'برنج':          { fifo: 185000, ref: 240000, lastSale: { price: 230000, date: '۱۴۰۳/۰۹/۲۴' }, lastToThis: { price: 225000, date: '۱۴۰۳/۰۹/۰۳' } },
};
const PRODUCT_NAMES = Object.keys(PRODUCT_DATA);

const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = n => String(n).replace(/[0-9]/g, d => FA[+d]);
const faNum = n => fa(Math.round(Number(n) || 0).toLocaleString('en-US')).replace(/,/g, '٬');

/* =========================================================
   State
   ========================================================= */
const state = {
  items: ITEMS.map(o => ({...o})),
  editingIdx: null,
  priceRevealed: false,
};

/* =========================================================
   Render main
   ========================================================= */
function render() {
  const body = document.getElementById('body');
  const subtotal = state.items.reduce((s, it) => s + it.qty * it.unitPrice, 0);

  body.innerHTML = `
    <div class="ctx">
      <div class="ctx-av">م</div>
      <div class="ctx-info">
        <div class="ctx-name">مغازهٔ حبوبات مرکزی</div>
        <div class="ctx-meta">۰۹۱۱۲۳۴۵۶۷۸</div>
      </div>
    </div>

    <div class="date-line">
      <span class="lbl">تاریخ فاکتور</span>
      <span class="val">۱۴۰۳/۰۹/۲۷</span>
    </div>

    <div class="sec-lbl">اقلام فاکتور</div>

    <div class="items-card">
      ${state.items.map((it, i) => renderItem(it, i)).join('')}
      <button class="add-line" id="addLine">
        <span class="add-line-plus">+</span>
        افزودن قلم جدید
      </button>
    </div>

    <div class="summary">
      <div class="sum-row"><span class="lbl">جمع اقلام</span><span class="val">${faNum(subtotal)} ت</span></div>
      <div class="sum-row"><span class="lbl">تخفیف</span><span class="val">۰ ت</span></div>
      <div class="sum-row total"><span class="lbl">جمع فاکتور</span><span class="val">${faNum(subtotal)} ت</span></div>
      <div class="sum-row"><span class="lbl">پرداخت شده</span><span class="val">۰ ت</span></div>
      <div class="sum-row total"><span class="lbl">مانده</span><span class="val">${faNum(subtotal)} ت</span></div>
    </div>

    <div class="pay-sec">
      <div class="pay-hd">
        <span>دریافتی همراه فاکتور (اختیاری)</span>
        <span class="total">۰ ت</span>
      </div>
      <div class="pay-grid">
        <button class="pay-btn"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>نقد</button>
        <button class="pay-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>کارت</button>
        <button class="pay-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M7 12h10"/></svg>چک</button>
        <button class="pay-btn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>اعتبار</button>
      </div>
    </div>
  `;

  bindMain();
}

function renderItem(it, idx) {
  const total = it.qty * it.unitPrice;
  const calc = `${fa(it.qty)} × ${faNum(it.unitPrice)}`;
  return `<div class="item-row" data-idx="${idx}">
    <span class="item-name">${it.name}</span>
    <span class="item-amount">
      <span class="item-total">${faNum(total)}</span>
      <span class="item-calc">${calc}</span>
    </span>
  </div>`;
}

function bindMain() {
  document.querySelectorAll('.item-row').forEach(row => {
    row.addEventListener('click', () => openEdit(+row.dataset.idx));
  });
  const add = document.getElementById('addLine');
  if (add) add.addEventListener('click', () => {
    state.items.push({ name: '', qty: 1, unit: 'کیلو', unitPrice: 0 });
    openEdit(state.items.length - 1);
  });
}

/* =========================================================
   Edit sheet
   ========================================================= */
function openEdit(idx) {
  state.editingIdx = idx;
  state.priceRevealed = false;

  const it = state.items[idx];
  const isOnly = state.items.length <= 1;

  renderEditSheet(it, idx, isOnly);

  document.getElementById('editBg').classList.add('show');
  document.getElementById('editSheet').classList.add('show');
  bindEditSheet(it, idx, isOnly);
}

function renderEditSheet(it, idx, isOnly) {
  const optionsHtml = PRODUCT_NAMES.map(n =>
    `<option value="${n}" ${n === it.name ? 'selected' : ''}>${n}</option>`
  ).join('');

  document.getElementById('editSheet').innerHTML = `
    <div class="edit-handle"></div>
    <div class="edit-hd">
      <span class="edit-hd-title">ویرایش قلم ${fa(idx + 1)}</span>
      <button class="edit-hd-close" id="editClose">بستن</button>
    </div>
    <div class="edit-body">
      <div class="edit-field">
        <label>نام کالا</label>
        <select id="eName">
          <option value="" ${it.name ? '' : 'selected'}>انتخاب کالا...</option>
          ${optionsHtml}
        </select>
      </div>

      <div class="edit-row-2">
        <div class="edit-field">
          <label>تعداد</label>
          <input type="text" inputmode="decimal" id="eQty" value="${fa(it.qty)}">
        </div>
        <div class="edit-field">
          <label>قیمت واحد (تومان)</label>
          <input type="text" inputmode="decimal" id="ePrice" value="${faNum(it.unitPrice)}">
          <span class="edit-field-hint" id="eFifoHint"></span>
        </div>
      </div>

      <div class="edit-line-total">
        <div class="edit-line-total-main">
          <span class="lbl">جمع این قلم</span>
          <span class="val" id="eTotal">${faNum(it.qty * it.unitPrice)} ت</span>
        </div>
        <div class="edit-line-profit" id="eProfit">
          <span>سود تقریبی</span>
          <span class="val" id="eProfitVal">—</span>
        </div>
      </div>

      <div id="ePriceInfoWrap"></div>

      <div class="edit-actions">
        <button class="edit-del" id="eDel" ${isOnly ? 'disabled' : ''}>حذف</button>
        <button class="edit-ok" id="eOk">تأیید</button>
      </div>
    </div>
  `;

  // populate dynamic bits
  refreshFifoHint();
  refreshProfit();
  refreshPriceInfo();
}

function refreshFifoHint() {
  const it = state.items[state.editingIdx];
  const el = document.getElementById('eFifoHint');
  if (!el) return;
  const data = PRODUCT_DATA[it.name];
  if (!data) { el.innerHTML = ''; return; }
  el.innerHTML = `خرید: <b>${faNum(data.fifo)}</b> ت`;
}

function refreshProfit() {
  const it = state.items[state.editingIdx];
  const el = document.getElementById('eProfit');
  const val = document.getElementById('eProfitVal');
  if (!el || !val) return;
  const data = PRODUCT_DATA[it.name];
  if (!data) {
    val.textContent = '—';
    el.classList.remove('pos', 'neg');
    return;
  }
  const profitPerUnit = it.unitPrice - data.fifo;
  const profitTotal = profitPerUnit * it.qty;
  const pct = data.fifo > 0 ? Math.round((profitPerUnit / data.fifo) * 100) : 0;
  const sign = profitTotal < 0 ? '−' : (profitTotal > 0 ? '+' : '');
  val.textContent = `${sign}${faNum(Math.abs(profitTotal))} ت (${fa(pct)}٪)`;
  el.classList.toggle('pos', profitTotal > 0);
  el.classList.toggle('neg', profitTotal < 0);
  el.classList.toggle('revealed', state.priceRevealed);
}

function refreshPriceInfo() {
  const wrap = document.getElementById('ePriceInfoWrap');
  if (!wrap) return;
  const it = state.items[state.editingIdx];
  const data = PRODUCT_DATA[it.name];
  if (!data) { wrap.innerHTML = ''; return; }

  const last = data.lastSale;
  const lastToThis = data.lastToThis;

  wrap.innerHTML = `
    <button type="button" class="price-more-toggle" id="ePriceToggle">
      <span>اطلاعات قیمت</span>
      <span class="chev">⌄</span>
    </button>
    <div class="price-more" id="ePriceMore" hidden>
      <div class="price-row">
        <span class="k">قیمت مرجع</span>
        <span class="v">${faNum(data.ref)} ت</span>
      </div>
      <div class="price-row">
        <span class="k">آخرین فروش کلی</span>
        <span class="v">${last ? `${faNum(last.price)} ت<span class="date">${last.date}</span>` : '<span class="v empty">ثبت نشده</span>'}</span>
      </div>
      <div class="price-row">
        <span class="k">آخرین فروش به این مشتری</span>
        <span class="v">${lastToThis ? `${faNum(lastToThis.price)} ت<span class="date">${lastToThis.date}</span>` : '<span class="v empty">ثبت نشده</span>'}</span>
      </div>
    </div>
  `;

  const toggle = document.getElementById('ePriceToggle');
  const more = document.getElementById('ePriceMore');
  toggle.addEventListener('click', () => {
    const open = !more.hidden;
    more.hidden = open;
    toggle.classList.toggle('open', !open);
  });
}

function bindEditSheet(it, idx, isOnly) {
  const close = (commit) => {
    document.getElementById('editBg').classList.remove('show');
    document.getElementById('editSheet').classList.remove('show');
    state.editingIdx = null;

    // If active row has no name and others exist, drop it silently
    setTimeout(() => {
      const row = state.items[idx];
      if (!commit && row && !row.name && state.items.length > 1) {
        state.items.splice(idx, 1);
      }
      render();
    }, 260);
  };

  document.getElementById('editClose').onclick = () => close(false);
  document.getElementById('editBg').onclick = () => close(false);

  document.getElementById('eName').onchange = e => {
    it.name = e.target.value;
    refreshFifoHint();
    refreshProfit();
    refreshPriceInfo();
  };

  document.getElementById('eQty').oninput = e => {
    it.qty = parseFloat(String(e.target.value).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[^\d.]/g, '')) || 0;
    document.getElementById('eTotal').textContent = faNum(it.qty * it.unitPrice) + ' ت';
    refreshProfit();
  };

  document.getElementById('ePrice').oninput = e => {
    it.unitPrice = parseFloat(String(e.target.value).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٬,]/g, '').replace(/[^\d.]/g, '')) || 0;
    document.getElementById('eTotal').textContent = faNum(it.qty * it.unitPrice) + ' ت';
    refreshProfit();
  };

  document.getElementById('eProfit').onclick = () => {
    state.priceRevealed = !state.priceRevealed;
    document.getElementById('eProfit').classList.toggle('revealed', state.priceRevealed);
  };

  document.getElementById('eDel').onclick = () => {
    if (isOnly) return;
    state.items.splice(idx, 1);
    close(true);
  };

  document.getElementById('eOk').onclick = () => {
    if (!it.name) { close(false); return; }
    close(true);
  };
}

/* =========================================================
   Controls
   ========================================================= */
document.querySelectorAll('[data-theme-btn]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-theme-btn]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.dataset.theme = b.dataset.themeBtn;
  });
});

document.querySelectorAll('[data-w]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-w]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('phone').dataset.w = b.dataset.w;
  });
});

render();
</script>

</body>
</html>
